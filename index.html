<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chibi Arsenal — Fusion Tactique</title>
  <meta name="description" content="Puzzle physique kawaii : fusionne des armes chibi jusqu'au mini-tank Graal !">
  <meta name="theme-color" content="#f6eefe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chibi Arsenal">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ================= HUD ================= -->
    <header class="hud">
      <div class="hud-scores">
        <div class="score-box" id="score-box">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="best-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3a5 5 0 0 1-10 0zM5 5H3v1a4 4 0 0 0 4 4M19 5h2v1a4 4 0 0 1-4 4M12 12v4m-4 4h8l-1-4H9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="label">Record</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
      <div class="hud-btns">
        <button class="icon-btn" id="btn-music" aria-label="Musique" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor"/><circle cx="16.5" cy="16" r="2.6" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-sfx" aria-label="Bruitages" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-pause" aria-label="Pause et paramètres">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.8" height="14" rx="1.9" fill="currentColor"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.9" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <!-- ================= Plateau ================= -->
    <main id="stage">
      <div id="board">
        <canvas id="game" aria-label="Cuve de jeu"></canvas>
        <div class="next-pill" id="next">
          <span>Suivant</span>
          <img id="next-img" alt="" draggable="false">
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>

    <!-- ================= Arbre d'évolution ================= -->
    <footer class="evo-wrap">
      <div class="evo-bar" id="evo" aria-label="Arbre d'évolution"></div>
    </footer>
  </div>

  <!-- ================= Menus ================= -->
  <section class="overlay" id="menu-start" aria-hidden="true">
    <div class="glass panel start-panel">
      <div class="showcase" id="start-showcase"></div>
      <h1 class="title">Chibi<span>Arsenal</span></h1>
      <p class="subtitle">Fusion tactique kawaii</p>
      <p class="howto">Glisse pour viser, relâche pour lâcher.<br>Deux armes identiques fusionnent… jusqu'au <b>Mini-Tank Graal</b> !</p>
      <button class="btn primary big" id="btn-play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Jouer
      </button>
      <p class="start-best">Record : <b id="start-best">0</b></p>
    </div>
  </section>

  <section class="overlay" id="menu-pause" aria-hidden="true">
    <div class="glass panel">
      <h2>Pause</h2>
      <div class="options">
        <label class="switch-row">
          <span>Musique lofi</span>
          <input type="checkbox" id="opt-music" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="switch-row">
          <span>Bruitages</span>
          <input type="checkbox" id="opt-sfx" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
      <button class="btn primary" id="btn-resume">Reprendre</button>
      <button class="btn ghost" id="btn-restart">Recommencer</button>
    </div>
  </section>

  <section class="overlay" id="menu-over" aria-hidden="true">
    <div class="glass panel over-panel">
      <h2>Mission terminée</h2>
      <div class="medal" id="over-medal"></div>
      <p class="medal-name" id="over-medal-name"></p>
      <div class="new-record" id="over-record" hidden>Nouveau record !</div>
      <div class="recap">
        <div><span class="label">Score</span><b id="over-score">0</b></div>
        <div><span class="label">Record</span><b id="over-best">0</b></div>
      </div>
      <div class="best-weapon">
        <img id="over-weapon-img" alt="">
        <div><span class="label">Meilleure arme</span><b id="over-weapon-name"></b></div>
      </div>
      <button class="btn primary big" id="btn-replay">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4.5H9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Rejouer
      </button>
    </div>
  </section>

  <!-- Matter.js via CDN (jsDelivr, version figée) + copie locale de secours -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script>window.Matter || document.write('<script src="vendor/matter.min.js"><\/script>');</script>
  <script src="sprites.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
